apiVersion: v1
kind: ServiceAccount
metadata:
  name: __PROJECT_SLUG__
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: __PROJECT_SLUG__
spec:
  selector:
    app.kubernetes.io/name: __PROJECT_SLUG__
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: __PROJECT_SLUG__
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: __PROJECT_SLUG__
  template:
    metadata:
      labels:
        app.kubernetes.io/name: __PROJECT_SLUG__
    spec:
      serviceAccountName: __PROJECT_SLUG__
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: app-image
          ports:
            - name: http
              containerPort: 8080
          env:
            - {name: ASPNETCORE_URLS, value: "http://+:8080"}
            - {name: OTEL_SERVICE_NAME, value: __PROJECT_SLUG__}
            - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://otel-collector.observability.svc.cluster.local:4318"}
          resources:
            requests: {cpu: 25m, memory: 96Mi}
            limits: {cpu: 300m, memory: 384Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            readOnlyRootFilesystem: true
          startupProbe:
            httpGet: {path: /health, port: http}
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 20
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
