apiVersion: v1
kind: ServiceAccount
metadata:
  name: __PROJECT_SLUG__
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: __PROJECT_SLUG__
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: __PROJECT_SLUG__
  template:
    metadata:
      labels:
        app.kubernetes.io/name: __PROJECT_SLUG__
    spec:
      serviceAccountName: __PROJECT_SLUG__
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: app-image
          env:
            - {name: OTEL_SERVICE_NAME, value: __PROJECT_SLUG__}
            - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://otel-collector.observability.svc.cluster.local:4318"}
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: 200m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            readOnlyRootFilesystem: true
          startupProbe:
            exec:
              command: [node, -e, "process.kill(1, 0)"]
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            exec:
              command: [node, -e, "process.kill(1, 0)"]
            periodSeconds: 10
          livenessProbe:
            exec:
              command: [node, -e, "process.kill(1, 0)"]
            periodSeconds: 20
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
