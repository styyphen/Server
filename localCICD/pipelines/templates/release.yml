name: release

on:
  push:
    branches:
      - main
    tags:
      - v*
  workflow_dispatch:
    inputs:
      version:
        description: Optional release version, for example v1.2.3.
        required: false
        type: string
  workflow_call:
    inputs:
      version:
        description: Optional release version, for example v1.2.3.
        required: false
        type: string
        default: ""
      image-name:
        description: Optional image name to tag for release.
        required: false
        type: string
        default: ""
      registry:
        description: Optional registry host.
        required: false
        type: string
        default: localhost:5000

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RELEASE_VERSION: ${{ inputs.version || github.ref_name }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install git-cliff
        uses: kenji-miyake/setup-git-cliff@v2

      - name: Resolve version
        id: version
        run: |
          $version = "${env:RELEASE_VERSION}"
          if (-not $version -or $version -eq "main") {
            $version = "v0.0.0-$($env:GITHUB_SHA.Substring(0, 7))"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV
        shell: pwsh

      - name: Generate changelog
        run: git cliff --tag "${{ steps.version.outputs.version }}" --output CHANGELOG.md
        shell: bash

      - name: Package release assets
        run: |
          New-Item -ItemType Directory -Force artifacts/release | Out-Null
          Copy-Item CHANGELOG.md artifacts/release/CHANGELOG.md
          "${{ steps.version.outputs.version }}" | Set-Content artifacts/release/VERSION.txt
          git archive --format zip --output "artifacts/release/source-${{ steps.version.outputs.version }}.zip" HEAD
        shell: pwsh

      - name: Generate release SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          artifact-name: release-sbom.spdx.json
          output-file: artifacts/release/release-sbom.spdx.json

      - name: Tag Docker image
        if: ${{ inputs.image-name != '' }}
        run: |
          docker tag "${{ inputs.registry }}/${{ inputs.image-name }}:local" "${{ inputs.registry }}/${{ inputs.image-name }}:${{ steps.version.outputs.version }}"
          docker push "${{ inputs.registry }}/${{ inputs.image-name }}:${{ steps.version.outputs.version }}"
        shell: bash

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ steps.version.outputs.version }}
          path: artifacts/release

      - name: Create GitHub release
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          files: artifacts/release/*
          body_path: CHANGELOG.md
