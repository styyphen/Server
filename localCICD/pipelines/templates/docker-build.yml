name: docker-build

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_call:
    inputs:
      image-name:
        description: Image name without tag.
        required: false
        type: string
        default: ""
      image-tag:
        description: Image tag.
        required: false
        type: string
        default: local
      context:
        description: Docker build context.
        required: false
        type: string
        default: .
      dockerfile:
        description: Dockerfile path.
        required: false
        type: string
        default: Dockerfile
      push:
        description: Push image after scan.
        required: false
        type: boolean
        default: false
      registry:
        description: Optional registry host, for example localhost:5000.
        required: false
        type: string
        default: ""

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  build-scan-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      IMAGE_REPOSITORY: ${{ inputs.registry && format('{0}/{1}', inputs.registry, inputs.image-name || github.event.repository.name) || (inputs.image-name || github.event.repository.name) }}
      IMAGE_TAG: ${{ inputs.image-tag || 'local' }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context || '.' }}
          file: ${{ inputs.dockerfile || 'Dockerfile' }}
          load: true
          tags: ${{ env.IMAGE_REPOSITORY }}:${{ env.IMAGE_TAG }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE_REPOSITORY }}:${{ env.IMAGE_TAG }}
          artifact-name: image-sbom.spdx.json
          output-file: artifacts/sbom/image-sbom.spdx.json

      - name: Scan image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE_REPOSITORY }}:${{ env.IMAGE_TAG }}
          format: sarif
          output: artifacts/security/trivy-image.sarif
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Upload scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: artifacts/security/trivy-image.sarif

      - name: Push image
        if: ${{ inputs.push }}
        run: docker push "${{ env.IMAGE_REPOSITORY }}:${{ env.IMAGE_TAG }}"
        shell: bash

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: image-sbom
          path: artifacts/sbom
          if-no-files-found: ignore
