name: opentofu-validate

on:
  pull_request:
    branches:
      - main
    paths:
      - opentofu/**
      - "**/*.tf"
      - "**/*.tfvars"
  push:
    branches:
      - main
  workflow_call:
    inputs:
      tofu-version:
        description: OpenTofu version.
        required: false
        type: string
        default: 1.10.0
      working-directory:
        description: OpenTofu environment directory.
        required: false
        type: string
        default: opentofu/environments/local
      plan:
        description: Run tofu plan.
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  security-events: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ${{ inputs.working-directory || 'opentofu/environments/local' }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ inputs.tofu-version || '1.10.0' }}

      - name: Format check
        run: tofu fmt -check -recursive ../..
        shell: bash

      - name: Init
        run: tofu init -backend=false
        shell: bash

      - name: Validate
        run: tofu validate
        shell: bash

      - name: Plan
        if: ${{ inputs.plan }}
        run: tofu plan -lock=false -input=false -out=tfplan
        shell: bash

      - name: IaC security scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: ${{ inputs.working-directory || 'opentofu/environments/local' }}
          framework: terraform
          output_format: cli,sarif
          output_file_path: console,artifacts/security/checkov-opentofu.sarif
          soft_fail: false

      - name: Policy check
        if: ${{ hashFiles('opentofu/policies/**/*.rego') != '' }}
        uses: instrumenta/conftest-action@v0.3.0
        with:
          files: ${{ inputs.working-directory || 'opentofu/environments/local' }}
          policy: opentofu/policies

      - name: Upload IaC artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: opentofu-validation
          path: |
            ${{ inputs.working-directory || 'opentofu/environments/local' }}/tfplan
            artifacts/security
          if-no-files-found: ignore
