name: security-scan

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_call:
    inputs:
      scan-path:
        description: Repository path to scan.
        required: false
        type: string
        default: .
      image-ref:
        description: Optional container image reference to scan.
        required: false
        type: string
        default: ""
      opentofu-path:
        description: Optional OpenTofu/Terraform path to scan.
        required: false
        type: string
        default: opentofu

permissions:
  contents: read
  security-events: write

jobs:
  security:
    name: secrets-dependencies-iac-image
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Filesystem vulnerability scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: ${{ inputs.scan-path || '.' }}
          format: sarif
          output: artifacts/security/trivy-fs.sarif
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Generate filesystem SBOM
        uses: anchore/sbom-action@v0
        with:
          path: ${{ inputs.scan-path || '.' }}
          artifact-name: filesystem-sbom.spdx.json
          output-file: artifacts/sbom/filesystem-sbom.spdx.json

      - name: IaC security scan
        if: ${{ hashFiles(format('{0}/**/*.tf', inputs.opentofu-path || 'opentofu')) != '' }}
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: ${{ inputs.opentofu-path || 'opentofu' }}
          framework: terraform
          output_format: cli,sarif
          output_file_path: console,artifacts/security/checkov.sarif
          soft_fail: false

      - name: Policy check
        if: ${{ hashFiles('opentofu/policies/**/*.rego') != '' }}
        uses: instrumenta/conftest-action@v0.3.0
        with:
          files: ${{ inputs.opentofu-path || 'opentofu' }}
          policy: opentofu/policies

      - name: Container image vulnerability scan
        if: ${{ inputs.image-ref != '' }}
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ inputs.image-ref }}
          format: sarif
          output: artifacts/security/trivy-image.sarif
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: artifacts/security

      - name: Upload security artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-artifacts
          path: artifacts
          if-no-files-found: ignore
