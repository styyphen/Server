apiVersion: v1
kind: ServiceAccount
metadata:
  name: fake-gcs
automountServiceAccountToken: false
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: fake-gcs-data
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: fake-gcs
spec:
  selector:
    app.kubernetes.io/name: fake-gcs
  ports:
    - {name: http, port: 4443, targetPort: http}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fake-gcs
  labels:
    platform.dev.home.arpa/addon: fake-gcs
spec:
  replicas: 0
  strategy: {type: Recreate}
  selector:
    matchLabels:
      app.kubernetes.io/name: fake-gcs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fake-gcs
        platform.dev.home.arpa/addon: fake-gcs
    spec:
      serviceAccountName: fake-gcs
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: fake-gcs
          image: docker.io/fsouza/fake-gcs-server:1.54.0
          args: [-scheme, http, -host, 0.0.0.0, -port, "4443", -data, /data]
          env:
            # Override Kubernetes' legacy Service link variable of the same name.
            - {name: FAKE_GCS_PORT, value: "4443"}
          ports:
            - {name: http, containerPort: 4443}
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: 300m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
          startupProbe:
            httpGet: {path: /storage/v1/b, port: http}
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet: {path: /storage/v1/b, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /storage/v1/b, port: http}
            periodSeconds: 30
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: data, mountPath: /storage}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: fake-gcs-data}
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
