apiVersion: v1
kind: ServiceAccount
metadata:
  name: localstack
automountServiceAccountToken: false
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: localstack-data
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 3Gi
---
apiVersion: v1
kind: Service
metadata:
  name: localstack
spec:
  selector:
    app.kubernetes.io/name: localstack
  ports:
    - {name: edge, port: 4566, targetPort: edge}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: localstack
  labels:
    platform.dev.home.arpa/addon: localstack
spec:
  replicas: 0
  strategy: {type: Recreate}
  selector:
    matchLabels:
      app.kubernetes.io/name: localstack
  template:
    metadata:
      labels:
        app.kubernetes.io/name: localstack
        platform.dev.home.arpa/addon: localstack
    spec:
      serviceAccountName: localstack
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: localstack
          image: docker.io/localstack/localstack:3.8.1
          env:
            - {name: SERVICES, value: "s3,sqs,dynamodb"}
            - {name: PERSISTENCE, value: "1"}
            - {name: EAGER_SERVICE_LOADING, value: "1"}
            - {name: DISABLE_EVENTS, value: "1"}
            - {name: DNS_ADDRESS, value: "0"}
            - {name: LS_LOG, value: warn}
            - {name: AWS_DEFAULT_REGION, value: us-east-1}
          ports:
            - {name: edge, containerPort: 4566}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
          startupProbe:
            httpGet: {path: /_localstack/health, port: edge}
            failureThreshold: 60
            periodSeconds: 3
          readinessProbe:
            httpGet: {path: /_localstack/health, port: edge}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /_localstack/health, port: edge}
            periodSeconds: 30
          volumeMounts:
            - {name: data, mountPath: /var/lib/localstack}
            - {name: cache, mountPath: /home/localstack/.cache}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: localstack-data}
        - name: tmp
          emptyDir: {sizeLimit: 512Mi}
        - name: cache
          emptyDir: {sizeLimit: 128Mi}
