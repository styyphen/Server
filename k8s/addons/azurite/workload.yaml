apiVersion: v1
kind: ServiceAccount
metadata:
  name: azurite
automountServiceAccountToken: false
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: azurite-data
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: azurite
spec:
  selector:
    app.kubernetes.io/name: azurite
  ports:
    - {name: blob, port: 10000, targetPort: blob}
    - {name: queue, port: 10001, targetPort: queue}
    - {name: table, port: 10002, targetPort: table}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: azurite
  labels:
    platform.dev.home.arpa/addon: azurite
spec:
  replicas: 0
  strategy: {type: Recreate}
  selector:
    matchLabels:
      app.kubernetes.io/name: azurite
  template:
    metadata:
      labels:
        app.kubernetes.io/name: azurite
        platform.dev.home.arpa/addon: azurite
    spec:
      serviceAccountName: azurite
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: azurite
          image: mcr.microsoft.com/azure-storage/azurite:3.35.0
          args:
            - azurite
            - --blobHost
            - 0.0.0.0
            - --queueHost
            - 0.0.0.0
            - --tableHost
            - 0.0.0.0
            - --location
            - /data
          ports:
            - {name: blob, containerPort: 10000}
            - {name: queue, containerPort: 10001}
            - {name: table, containerPort: 10002}
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: 300m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
          startupProbe:
            tcpSocket: {port: blob}
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            tcpSocket: {port: blob}
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: blob}
            periodSeconds: 30
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: azurite-data}
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
