# Install as /etc/rancher/k3s/config.yaml before starting K3s.
write-kubeconfig-mode: "0640"
secrets-encryption: true
kubelet-arg:
  - "system-reserved=cpu=250m,memory=512Mi,ephemeral-storage=1Gi"
  - "kube-reserved=cpu=250m,memory=256Mi,ephemeral-storage=1Gi"
  - "eviction-hard=memory.available<500Mi,nodefs.available<10%,imagefs.available<10%"
  - "eviction-soft=memory.available<750Mi,nodefs.available<15%,imagefs.available<15%"
  - "eviction-soft-grace-period=memory.available=2m,nodefs.available=5m,imagefs.available=5m"
  - "serialize-image-pulls=true"
