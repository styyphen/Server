apiVersion: v1
kind: LimitRange
metadata:
  name: workload-defaults
  namespace: platform-system
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 50m
        memory: 128Mi
      default:
        cpu: 500m
        memory: 512Mi
---
apiVersion: v1
kind: LimitRange
metadata:
  name: workload-defaults
  namespace: observability
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 50m
        memory: 128Mi
      default:
        cpu: 750m
        memory: 768Mi
---
apiVersion: v1
kind: LimitRange
metadata:
  name: workload-defaults
  namespace: cloud-emulators
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 50m
        memory: 128Mi
      default:
        cpu: "1"
        memory: 1Gi
---
apiVersion: v1
kind: LimitRange
metadata:
  name: job-defaults
  namespace: ci-jobs
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 250m
        memory: 512Mi
      default:
        cpu: 1500m
        memory: 2Gi
