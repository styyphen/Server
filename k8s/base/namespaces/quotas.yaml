apiVersion: v1
kind: ResourceQuota
metadata:
  name: platform-budget
  namespace: platform-system
spec:
  hard:
    requests.cpu: "1"
    requests.memory: 2Gi
    limits.cpu: "3"
    limits.memory: 4Gi
    persistentvolumeclaims: "8"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: observability-budget
  namespace: observability
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 4Gi
    limits.cpu: "5"
    limits.memory: 6Gi
    persistentvolumeclaims: "10"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: emulator-budget
  namespace: cloud-emulators
spec:
  hard:
    requests.cpu: "1"
    requests.memory: 3Gi
    limits.cpu: "3"
    limits.memory: 5Gi
    pods: "8"
    persistentvolumeclaims: "8"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: ci-budget
  namespace: ci-jobs
spec:
  hard:
    requests.cpu: "1500m"
    requests.memory: 2Gi
    limits.cpu: "2"
    limits.memory: 3Gi
    pods: "5"
    count/jobs.batch: "3"
    persistentvolumeclaims: "2"
