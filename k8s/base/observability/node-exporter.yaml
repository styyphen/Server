apiVersion: v1
kind: ServiceAccount
metadata:
  name: node-exporter
  namespace: kube-system
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: node-exporter
  namespace: kube-system
spec:
  selector:
    app.kubernetes.io/name: node-exporter
  ports:
    - {name: metrics, port: 9100, targetPort: metrics}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-exporter
  namespace: kube-system
spec:
  selector:
    matchLabels: {app.kubernetes.io/name: node-exporter}
  template:
    metadata:
      labels: {app.kubernetes.io/name: node-exporter}
    spec:
      serviceAccountName: node-exporter
      automountServiceAccountToken: false
      hostNetwork: true
      hostPID: true
      securityContext:
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: node-exporter
          image: docker.io/prom/node-exporter:v1.8.2
          args:
            - --path.procfs=/host/proc
            - --path.sysfs=/host/sys
            - --path.rootfs=/host/root
            - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/kubelet/.+|var/lib/rancher/k3s/agent/containerd/.+)($|/)
          ports:
            - {name: metrics, containerPort: 9100}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 200m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            readOnlyRootFilesystem: true
          startupProbe:
            httpGet: {path: /, port: metrics}
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet: {path: /, port: metrics}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /, port: metrics}
            periodSeconds: 30
          volumeMounts:
            - {name: proc, mountPath: /host/proc, readOnly: true}
            - {name: sys, mountPath: /host/sys, readOnly: true}
            - {name: root, mountPath: /host/root, readOnly: true}
      volumes:
        - name: proc
          hostPath: {path: /proc, type: Directory}
        - name: sys
          hostPath: {path: /sys, type: Directory}
        - name: root
          hostPath: {path: /, type: Directory}
