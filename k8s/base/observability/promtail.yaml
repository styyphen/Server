apiVersion: v1
kind: ServiceAccount
metadata:
  name: promtail
  namespace: kube-system
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail-config
  namespace: kube-system
data:
  promtail.yml: |
    server:
      http_listen_port: 9080
      grpc_listen_port: 0
    positions:
      filename: /run/promtail/positions.yml
    clients:
      - url: http://loki.observability.svc.cluster.local:3100/loki/api/v1/push
    scrape_configs:
      - job_name: kubernetes-pods
        static_configs:
          - targets: [localhost]
            labels:
              job: kubernetes-pods
              __path__: /var/log/pods/*/*/*.log
        pipeline_stages:
          - cri: {}
---
apiVersion: v1
kind: Service
metadata:
  name: promtail
  namespace: kube-system
spec:
  selector:
    app.kubernetes.io/name: promtail
  ports:
    - {name: http, port: 9080, targetPort: http}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: promtail
  namespace: kube-system
spec:
  selector:
    matchLabels: {app.kubernetes.io/name: promtail}
  template:
    metadata:
      labels: {app.kubernetes.io/name: promtail}
    spec:
      serviceAccountName: promtail
      securityContext:
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: promtail
          image: docker.io/grafana/promtail:3.3.2
          args:
            - -config.file=/etc/promtail/promtail.yml
          ports:
            - {name: http, containerPort: 9080}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 200m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            runAsUser: 0
            runAsGroup: 0
            readOnlyRootFilesystem: true
          startupProbe:
            httpGet: {path: /ready, port: http}
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet: {path: /ready, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /ready, port: http}
            periodSeconds: 30
          volumeMounts:
            - {name: config, mountPath: /etc/promtail, readOnly: true}
            - {name: positions, mountPath: /run/promtail}
            - {name: pod-logs, mountPath: /var/log/pods, readOnly: true}
      volumes:
        - name: config
          configMap: {name: promtail-config}
        - name: positions
          emptyDir: {sizeLimit: 32Mi}
        - name: pod-logs
          hostPath: {path: /var/log/pods, type: Directory}
