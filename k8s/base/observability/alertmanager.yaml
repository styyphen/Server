apiVersion: v1
kind: ServiceAccount
metadata:
  name: alertmanager
  namespace: observability
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: observability
data:
  alertmanager.yml: |
    route:
      receiver: local-log
      group_wait: 5s
      group_interval: 30s
      repeat_interval: 4h
    receivers:
      - name: local-log
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: alertmanager-data
  namespace: observability
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: observability
spec:
  selector:
    app.kubernetes.io/name: alertmanager
  ports:
    - {name: http, port: 9093, targetPort: http}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: observability
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: alertmanager}
  template:
    metadata:
      labels: {app.kubernetes.io/name: alertmanager}
    spec:
      serviceAccountName: alertmanager
      securityContext:
        fsGroup: 65534
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: alertmanager
          image: docker.io/prom/alertmanager:v0.28.0
          args:
            - --config.file=/etc/alertmanager/alertmanager.yml
            - --storage.path=/alertmanager
            - --data.retention=120h
          ports:
            - {name: http, containerPort: 9093}
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 100m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            readOnlyRootFilesystem: true
          startupProbe:
            httpGet: {path: /-/ready, port: http}
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet: {path: /-/ready, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /-/healthy, port: http}
            periodSeconds: 30
          volumeMounts:
            - {name: config, mountPath: /etc/alertmanager, readOnly: true}
            - {name: data, mountPath: /alertmanager}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: config
          configMap: {name: alertmanager-config}
        - name: data
          persistentVolumeClaim: {claimName: alertmanager-data}
        - name: tmp
          emptyDir: {sizeLimit: 32Mi}
      terminationGracePeriodSeconds: 30
