apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-models
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 50Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
spec:
  replicas: 1
  selector:
    matchLabels: {app: ollama}
  template:
    metadata:
      labels: {app: ollama}
    spec:
      containers:
        - name: ollama
          image: ollama/ollama:latest
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 11434}]
          env:
            - {name: OLLAMA_HOST, value: "0.0.0.0:11434"}
            - {name: OLLAMA_KEEP_ALIVE, value: "24h"}
          readinessProbe:
            httpGet: {path: /, port: 11434}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /, port: 11434}
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: {cpu: 500m, memory: 4Gi}
            limits: {cpu: "4", memory: 8Gi}
          volumeMounts:
            - {name: models, mountPath: /root/.ollama}
      volumes:
        - name: models
          persistentVolumeClaim: {claimName: ollama-models}
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
spec:
  type: NodePort
  selector: {app: ollama}
  ports:
    - {name: http, port: 11434, targetPort: 11434, nodePort: 31134}
---
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: ollama-long
spec:
  forwardingTimeouts:
    dialTimeout: 30s
    idleConnTimeout: 3600s
    responseHeaderTimeout: 0s
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: ollama
spec:
  entryPoints: [web]
  routes:
    - kind: Rule
      match: Host(`ollama.dev.home.arpa`)
      services:
        - name: ollama
          port: 11434
          serversTransport: ollama-long
