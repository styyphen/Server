apiVersion: v1
kind: ConfigMap
metadata: {name: ci-job-launcher}
data:
  run-fullstack-delivery.sh: |
    #!/bin/sh
    set -eu
    safe_id="$(printf '%s' "${GITHUB_RUN_ID:-manual}" | tr -cd 'a-zA-Z0-9-' | tr 'A-Z' 'a-z' | cut -c1-24)"
    [ -n "$safe_id" ] || safe_id=manual
    revision="$(printf '%s' "${GITHUB_SHA:-local}" | cut -c1-12)"
    job="fullstack-${safe_id}"
    image="registry.platform-system.svc.cluster.local:5000/junior-fullstack-demo:${revision}"
    deploy_image="registry.dev.home.arpa/junior-fullstack-demo:${revision}"
    kubectl delete job "$job" --ignore-not-found --wait=true
    kubectl apply -f - <<EOF_JOB
    apiVersion: batch/v1
    kind: Job
    metadata: {name: ${job}, labels: {app.kubernetes.io/name: junior-fullstack-delivery}}
    spec:
      activeDeadlineSeconds: 900
      backoffLimit: 0
      ttlSecondsAfterFinished: 1800
      template:
        metadata: {labels: {app.kubernetes.io/name: junior-fullstack-delivery}}
        spec:
          serviceAccountName: ci-job
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext: {fsGroup: 1000, runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, seccompProfile: {type: RuntimeDefault}}
          initContainers:
            - name: checkout
              image: docker.io/alpine/git:2.47.2
              command: [sh, -c]
              args: ['git -c http.extraHeader="Authorization: token \$GITEA_TOKEN" clone "http://gitea-headless.platform-system.svc.cluster.local:3000/${GITHUB_REPOSITORY}.git" /workspace && cd /workspace && git -c safe.directory=/workspace checkout "${GITHUB_SHA}"']
              env: [{name: GITEA_TOKEN, valueFrom: {secretKeyRef: {name: gitea-ci-checkout, key: token}}}]
              resources: {requests: {cpu: 10m, memory: 32Mi}, limits: {cpu: 50m, memory: 96Mi}}
              securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
              volumeMounts: [{name: workspace, mountPath: /workspace}]
            - name: test
              image: docker.io/library/node:22.14.0-alpine
              command: [sh, -c]
              args: ["cd /workspace && npm run build && npm run coverage"]
              resources: {requests: {cpu: 25m, memory: 48Mi}, limits: {cpu: 100m, memory: 128Mi}}
              securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
              volumeMounts: [{name: workspace, mountPath: /workspace}]
            - name: sonar
              image: docker.io/sonarsource/sonar-scanner-cli:11.5
              command: [sh, -c]
              args: ['cd /workspace && sonar-scanner -Dsonar.host.url=http://sonarqube-headless.cloud-emulators.svc.cluster.local:9000 -Dsonar.projectKey=junior-fullstack-demo -Dsonar.sources=lib,public,server.js -Dsonar.tests=test -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info -Dsonar.token="\$SONAR_TOKEN" -Dsonar.qualitygate.wait=true -Dsonar.qualitygate.timeout=300']
              env:
                - {name: SONAR_TOKEN, valueFrom: {secretKeyRef: {name: sonarqube-ci, key: token}}}
                - {name: SONAR_SCANNER_JAVA_OPTS, value: "-Xmx512m"}
              resources: {requests: {cpu: 50m, memory: 192Mi}, limits: {cpu: 200m, memory: 768Mi}}
              securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
              volumeMounts: [{name: workspace, mountPath: /workspace}]
          containers:
            - name: image-build
              image: docker.io/library/busybox:1.36.1
              command: [sh, -c]
              args:
                - |
                  set -eu
                  mkdir -p /build/rootfs/app
                  cp -R /workspace/package.json /workspace/server.js /workspace/lib /workspace/public /build/rootfs/app/
                  tar -cf /build/app.tar -C /build/rootfs .
                  export DOCKER_CONFIG=/docker
                  /opt/crane/ko-app/crane append --insecure --base docker.io/library/node:22.14.0-alpine -f /build/app.tar -t "${image}"
                  /opt/crane/ko-app/crane mutate --insecure --entrypoint node --cmd /app/server.js --workdir /app -t "${image}" "${image}"
                  /opt/crane/ko-app/crane copy --insecure "${image}" registry.platform-system.svc.cluster.local:5000/junior-fullstack-demo:latest
              resources: {requests: {cpu: 50m, memory: 96Mi}, limits: {cpu: 150m, memory: 256Mi}}
              securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}, readOnlyRootFilesystem: true}
              volumeMounts:
                - {name: workspace, mountPath: /workspace, readOnly: true}
                - {name: registry-auth, mountPath: /docker, readOnly: true}
                - {name: build-work, mountPath: /build}
                - {name: crane, mountPath: /opt/crane, readOnly: true}
          volumes:
            - {name: workspace, emptyDir: {sizeLimit: 512Mi}}
            - {name: registry-auth, secret: {secretName: ci-registry-dockerconfig, items: [{key: .dockerconfigjson, path: config.json}]}}
            - {name: build-work, emptyDir: {sizeLimit: 256Mi}}
            - name: crane
              image: {reference: gcr.io/go-containerregistry/crane:v0.20.3, pullPolicy: IfNotPresent}
    EOF_JOB
    if ! kubectl wait --for=condition=complete "job/${job}" --timeout=920s; then
      kubectl describe "job/${job}" || true
      kubectl logs "job/${job}" --all-containers=true --timestamps || true
      exit 1
    fi
    kubectl logs "job/${job}" --all-containers=true --timestamps
    kubectl -n demo-apps set image deployment/junior-fullstack-demo "app=${deploy_image}"
    kubectl -n demo-apps set env deployment/junior-fullstack-demo "RELEASE_VERSION=${revision}"
    kubectl -n demo-apps rollout status deployment/junior-fullstack-demo --timeout=180s
