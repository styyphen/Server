apiVersion: v1
kind: ServiceAccount
metadata:
  name: gitea-runner
automountServiceAccountToken: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gitea-runner-config
data:
  config.yaml: |
    log:
      level: info
    runner:
      file: /data/.runner
      capacity: 1
      timeout: 30m
      shutdown_timeout: 30s
      labels:
        - "stage-f-orchestrator:host"
    cache:
      enabled: false
    container:
      docker_host: "-"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gitea-runner-data
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitea-runner
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: gitea-runner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gitea-runner
        app.kubernetes.io/component: ci-orchestrator
    spec:
      serviceAccountName: gitea-runner
      automountServiceAccountToken: true
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: prepare-kubeconfig
          image: docker.io/library/busybox:1.36.1
          command: [sh, -c]
          args:
            - >-
              set -eu; mkdir -p /work/runner-home/.kube;
              printf 'apiVersion: v1\nkind: Config\nclusters:\n- name: local\n  cluster:\n    server: https://10.43.0.1:443\n    certificate-authority: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt\nusers:\n- name: runner\n  user:\n    tokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token\ncontexts:\n- name: local\n  context:\n    cluster: local\n    user: runner\n    namespace: ci-jobs\ncurrent-context: local\n' > /work/runner-home/.kube/config;
              chmod 600 /work/runner-home/.kube/config
          resources: {requests: {cpu: 5m, memory: 8Mi}, limits: {cpu: 25m, memory: 32Mi}}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          volumeMounts:
            - {name: tmp, mountPath: /work}
      containers:
        - name: runner
          image: docker.io/gitea/runner:1.0.0
          imagePullPolicy: IfNotPresent
          env:
            - name: CONFIG_FILE
              value: /config/config.yaml
            - name: GITEA_INSTANCE_URL
              value: http://gitea.platform-system.svc.cluster.local:3000
            - name: GITEA_RUNNER_REGISTRATION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: gitea-runner-registration
                  key: token
            - name: GITEA_RUNNER_NAME
              value: local-k3s-stage-f
            - name: PATH
              value: /opt/kubectl-image/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
            - name: HOME
              value: /tmp/runner-home
            - name: XDG_CACHE_HOME
              value: /tmp/runner-cache
            - name: KUBECONFIG
              value: /tmp/runner-home/.kube/config
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          startupProbe:
            exec:
              command: ["test", "-s", "/data/.runner"]
            failureThreshold: 60
            periodSeconds: 2
          readinessProbe:
            exec:
              command: ["test", "-s", "/data/.runner"]
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
            - name: kubectl-image
              mountPath: /opt/kubectl-image
              readOnly: true
            - name: launcher
              mountPath: /opt/ci
              readOnly: true
      terminationGracePeriodSeconds: 45
      volumes:
        - name: config
          configMap:
            name: gitea-runner-config
        - name: data
          persistentVolumeClaim:
            claimName: gitea-runner-data
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
        - name: kubectl-image
          image:
            reference: registry.k8s.io/kubectl:v1.36.1
            pullPolicy: IfNotPresent
        - name: launcher
          configMap:
            name: ci-job-launcher
            defaultMode: 0555
