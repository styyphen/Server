apiVersion: batch/v1
kind: CronJob
metadata:
  name: ci-artifact-retention
spec:
  schedule: "30 3 * * *"
  timeZone: Africa/Johannesburg
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  startingDeadlineSeconds: 1800
  jobTemplate:
    spec:
      activeDeadlineSeconds: 300
      backoffLimit: 0
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: ci-artifact-retention
            app.kubernetes.io/component: retention
        spec:
          serviceAccountName: ci-job
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            fsGroup: 65534
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: cleanup
              image: docker.io/library/busybox:1.36.1
              command: [/bin/sh, -c]
              args:
                - |
                  set -eu
                  timestamp="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
                  before="$(find /artifacts -mindepth 1 -maxdepth 1 -type d -mtime +14 | wc -l)"
                  printf 'timestamp=%s level=info event=artifact_cleanup_started candidates=%s retention_days=14\n' "$timestamp" "$before"
                  find /artifacts -mindepth 1 -maxdepth 1 -type d -mtime +14 -exec rm -rf -- {} +
                  remaining="$(find /artifacts -mindepth 1 -maxdepth 1 -type d | wc -l)"
                  printf 'timestamp=%s level=info event=artifact_cleanup_completed removed=%s remaining=%s\n' \
                    "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$before" "$remaining"
              resources:
                requests: {cpu: 10m, memory: 16Mi}
                limits: {cpu: 100m, memory: 64Mi}
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: {drop: ["ALL"]}
                readOnlyRootFilesystem: true
              volumeMounts:
                - {name: artifacts, mountPath: /artifacts}
          volumes:
            - name: artifacts
              persistentVolumeClaim:
                claimName: ci-artifacts
