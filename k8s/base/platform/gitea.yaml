apiVersion: v1
kind: Service
metadata:
  name: gitea
spec:
  selector:
    app.kubernetes.io/name: gitea
  ports:
    - name: http
      port: 3000
      targetPort: http
    - name: ssh
      port: 22
      targetPort: ssh
---
apiVersion: v1
kind: Service
metadata:
  name: gitea-ssh
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: gitea
  ports:
    - name: ssh
      port: 22
      targetPort: ssh
      nodePort: 32222
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: gitea
spec:
  serviceName: gitea
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gitea
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gitea
    spec:
      serviceAccountName: gitea
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gitea
          image: docker.io/gitea/gitea:1.26.2-rootless
          imagePullPolicy: IfNotPresent
          env:
            - name: GITEA__server__DOMAIN
              value: gitea.dev.home.arpa
            - name: GITEA__server__ROOT_URL
              value: https://gitea.dev.home.arpa/
            - name: GITEA__server__SSH_DOMAIN
              value: gitea.dev.home.arpa
            - name: GITEA__server__SSH_PORT
              value: "32222"
            - name: GITEA__server__START_SSH_SERVER
              value: "true"
            - name: GITEA__database__DB_TYPE
              value: sqlite3
            - name: GITEA__database__PATH
              value: /var/lib/gitea/data/gitea/gitea.db
            - name: GITEA__metrics__ENABLED
              value: "true"
            - name: GITEA__security__INSTALL_LOCK
              value: "true"
            - name: GITEA__security__SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: gitea-secrets
                  key: secret-key
            - name: GITEA__security__INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: gitea-secrets
                  key: internal-token
            - name: GITEA__server__LFS_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: gitea-secrets
                  key: lfs-jwt-secret
            - name: GITEA__oauth2__JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: gitea-secrets
                  key: oauth2-jwt-secret
          ports:
            - name: http
              containerPort: 3000
            - name: ssh
              containerPort: 2222
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          startupProbe:
            httpGet:
              path: /api/healthz
              port: http
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/healthz
              port: http
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/gitea
            - name: config
              mountPath: /etc/gitea
      terminationGracePeriodSeconds: 30
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 10Gi
    - metadata:
        name: config
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gitea
automountServiceAccountToken: false
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gitea
spec:
  ingressClassName: traefik
  tls:
    - hosts: [gitea.dev.home.arpa]
      secretName: platform-tls
  rules:
    - host: gitea.dev.home.arpa
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gitea
                port:
                  name: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gitea
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: gitea
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ci-jobs
          podSelector:
            matchLabels:
              app.kubernetes.io/name: gitea-runner
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ci-jobs
          podSelector:
            matchLabels:
              app.kubernetes.io/name: junior-fullstack-delivery
      ports:
        - port: 3000
          protocol: TCP
    - ports:
        - port: 2222
          protocol: TCP
