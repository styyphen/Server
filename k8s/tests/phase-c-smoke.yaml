apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: phase-c-smoke
  namespace: ci-jobs
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 64Mi
  storageClassName: local-path
---
apiVersion: v1
kind: Pod
metadata:
  name: phase-c-smoke
  namespace: ci-jobs
  labels:
    app.kubernetes.io/name: phase-c-smoke
spec:
  automountServiceAccountToken: false
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    fsGroup: 65534
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: smoke
      image: busybox:1.37.0
      imagePullPolicy: IfNotPresent
      command:
        - /bin/sh
        - -ec
        - |
          nslookup kubernetes.default.svc.cluster.local
          echo "persistent-storage-ok" > /data/result
          test "$(cat /data/result)" = "persistent-storage-ok"
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 64Mi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        readOnlyRootFilesystem: true
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: phase-c-smoke
