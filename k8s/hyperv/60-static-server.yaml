network:
  version: 2
  ethernets:
    eth0:
      match:
        macaddress: "00:15:5d:82:65:00"
        driver: "hv_netvsc"
      set-name: eth0
      dhcp4: false
      dhcp6: false
      addresses:
        - 192.168.50.10/24
      routes:
        - to: default
          via: 192.168.50.1
      nameservers:
        addresses:
          - 1.1.1.1
          - 8.8.8.8
