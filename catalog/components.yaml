apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: gitea
  description: Git server for app source and pull requests.
  links:
    - url: https://gitea.dev.home.arpa
      title: Gitea
  annotations:
    backstage.io/kubernetes-namespace: platform-system
    backstage.io/kubernetes-label-selector: app.kubernetes.io/name=gitea
spec:
  type: service
  lifecycle: production
  owner: group:default/platform-operators
  system: local-development-platform
