global:
  resolve_timeout: 5m

route:
  receiver: local-log
  group_by:
    - alertname
    - severity
    - alert_category
    - failure_cause
    - job
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 1h

receivers:
  - name: local-log

inhibit_rules:
  - source_matchers:
      - severity="critical"
    target_matchers:
      - severity=~"warning|error"
    equal:
      - alertname
      - job
